# Markdownlint configuration
# https://github.com/DavidAnson/markdownlint/blob/main/schema/.markdownlint.yaml

# MD013/line-length: off. House style is sentence-per-line, not character-wrapped, so a
# long sentence or a long URL on one line is expected, not a defect.
MD013: false

# Allow HTML needed by MkDocs Material (grids, admonitions)
MD033:
  allowed_elements:
    - div
    - img
    - br

# MkDocs files use YAML frontmatter before the first heading
MD041: false

# MkDocs admonitions and tabs use fenced blocks without a language
MD040: false

# mdformat-mkdocs indents nested list items by 4 spaces, matching the
# python-markdown parser MkDocs uses (not the 2-space CommonMark default)
MD007:
  indent: 4
